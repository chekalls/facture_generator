services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: FactureGenerator
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-facture_generator};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - facture_network
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    container_name: FactureGeneratorDB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facture_generator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-facture_generator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facture_network
    restart: unless-stopped

networks:
  facture_network:

volumes:
  postgres_data:
