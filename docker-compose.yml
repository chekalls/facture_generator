services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_management_system_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=employee_management_system;Username=postgres;Password=postgres
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-admin@employee-management.local}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-Admin123!}
      Seed__Admin__FirstName: ${SEED_ADMIN_FIRSTNAME:-Admin}
      Seed__Admin__LastName: ${SEED_ADMIN_LASTNAME:-Système}
    ports:
      - "8080:8080"
    networks:
      - employee_management_system_network
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    container_name: employee_management_system_db
    environment:
      POSTGRES_DB: employee_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_management_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - employee_management_system_network
    restart: unless-stopped

networks:
  employee_management_system_network:

volumes:
  postgres_data:
