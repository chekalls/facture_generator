services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: FactureGenerator
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-facture_generator};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - facture_network
    restart: unless-stopped

  # Applique les migrations EF Core a la demande, sans demarrer l'application :
  #   docker compose --profile tools run --rm migrations
  # La chaine de connexion doit rester identique a celle du service `app`.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-facture_generator};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
    networks:
      - facture_network

  db:
    image: postgres:18.6-alpine
    container_name: FactureGeneratorDB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facture_generator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Donnees stockees dans le projet (./dbdata/18/docker) et non dans un volume gere par Docker.
      # /var/lib/postgresql est le chemin declare en VOLUME par l'image postgres:18.
      - ./dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-facture_generator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facture_network
    restart: unless-stopped

networks:
  facture_network:
